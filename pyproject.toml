[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wordle-cli"
version = "0.3.0"
description = "A command-line interface for the Wordle game"
license = "MIT"
readme = "README.md"
python = ">=3.8"

dependencies = [
    "rich",
]

[project.optional-dependencies]
api = ["requests"]
dev = ["pytest", "pytest-cov", "flake8"]

[project.scripts]
wordle = "src.cli:main"
run-app = "src.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src"]
exclude = ["src/data/history.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]